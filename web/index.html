<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>agent-connect · 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%235b8cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%235b8cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Login (only shown if server requires a token) -->
  <div class="login" id="login">
    <div class="login__card">
      <div class="login__mark">agent<span class="dot">-connect</span></div>
      <div class="login__sub">本机 Agent 会话控制台</div>
      <div class="login__row">
        <input id="token" type="password" placeholder="访问令牌（开放模式可留空）" autocomplete="current-password">
        <button class="btn" id="loginBtn">进入</button>
      </div>
      <div class="login__err" id="loginErr"></div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">agent<span class="dot">-connect</span></div>
      <nav class="tabs" id="viewTabs">
        <button class="tab is-active" data-view="board">看板</button>
        <button class="tab" data-view="messenger">信使</button>
      </nav>
      <div class="fleet">
        <span class="fleet__stat"><b class="is-busy" id="cntBusy">0</b> 运行</span>
        <span class="fleet__stat"><b class="is-wait" id="cntWait">0</b> 待输入</span>
        <span class="fleet__stat"><b class="is-idle" id="cntIdle">0</b> 空闲</span>
      </div>
      <div class="spacer"></div>
      <div class="conn" id="conn"><span class="conn__dot"></span><span id="connText">连接中…</span></div>
      <button class="iconbtn" id="settingsBtn">设置</button>
    </header>

    <!-- Board view -->
    <main class="view" id="view-board">
      <div class="view__head">
        <span class="eyebrow">全部会话看板</span>
        <div class="spacer"></div>
        <label class="filter">已完成任务范围
          <select id="filterWindow">
            <option value="1">近 1 天</option>
            <option value="3">近 3 天</option>
            <option value="7">近 7 天</option>
            <option value="0">全部</option>
          </select>
        </label>
        <button class="iconbtn" id="newBtn">+ 新建会话</button>
        <button class="iconbtn" id="refreshBtn">刷新</button>
      </div>
      <div class="board" id="board"></div>
    </main>

    <!-- Detail view (single agent) -->
    <main class="view" id="view-detail" style="display:none;">
      <div class="console__head">
        <button class="console__back" id="detailBack" aria-label="返回">‹ 看板</button>
        <div class="console__title">
          <div class="console__name" id="dName">—</div>
          <div class="console__sub mono" id="dSub"></div>
        </div>
        <div class="console__actions" id="dActions"></div>
      </div>
      <div class="stream-view" id="detailView"><div id="detailMessages"></div></div>
      <div class="composer">
        <textarea id="detailInput" rows="1" placeholder="发送到该会话…"></textarea>
        <button class="btn" id="detailSend">发送</button>
      </div>
    </main>

    <!-- Messenger view -->
    <main class="view" id="view-messenger" style="display:none;">
      <div class="console__head">
        <div class="console__title">
          <div class="console__name">信使 Agent <span class="cur-badge" id="curBadge" style="display:none;"></span></div>
          <div class="console__sub">路由管理器 · 与钉钉共享上下文 · 变更需确认</div>
        </div>
        <div class="console__actions"><button class="iconbtn" id="mRefresh">刷新</button></div>
      </div>
      <div class="confirm" id="confirmBox" style="display:none;">
        <div class="confirm__title">待确认操作</div>
        <ul class="confirm__list" id="confirmList"></ul>
        <div class="confirm__row">
          <button class="btn btn--warn" id="confirmYes">确认执行</button>
          <button class="btn btn--ghost" id="confirmNo">取消</button>
        </div>
      </div>
      <div class="stream-view" id="mView"><div id="mMessages"></div></div>
      <div class="composer">
        <textarea id="mInput" rows="1" placeholder="对信使说…（列出会话 / 切到 abc / 继续 / 接管 / 退出）"></textarea>
        <button class="btn" id="mSend">发送</button>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Settings modal -->
  <div class="modal" id="settingsModal">
    <div class="modal__card">
      <div class="modal__head"><div class="modal__title">设置</div><button class="modal__close" id="settingsClose">×</button></div>
      <div class="tabs modal__tabs">
        <button class="tab is-active" data-tab="llm">LLM Provider</button>
        <button class="tab" data-tab="im">IM 连接器</button>
      </div>
      <div class="tabpane is-active" id="tab-llm">
        <label>Provider</label>
        <select id="llm_provider">
          <option value="openai-compatible">openai-compatible</option>
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
        </select>
        <label>Model</label><input id="llm_model" placeholder="model">
        <label>Base URL</label><input id="llm_base_url" placeholder="https://gateway/v1">
        <label>API Key</label><input id="llm_api_key" type="password" placeholder="留空保持不变">
        <label>Auth style <span class="hint">(anthropic 网关可填 bearer)</span></label><input id="llm_auth" placeholder="留空=默认">
        <div class="modal__row"><button class="btn" id="llmSave">保存</button></div>
      </div>
      <div class="tabpane" id="tab-im">
        <div class="section-label">钉钉凭证 (cc-connect)</div>
        <label>Client ID</label><input id="im_client_id" placeholder="dingxxxx">
        <label>Client Secret</label><input id="im_client_secret" type="password" placeholder="留空保持不变">
        <div class="section-label">闸门</div>
        <label><input type="checkbox" id="im_enabled"> 启用</label>
        <label>命令前缀 <span class="hint">(留空=处理所有)</span></label><input id="im_prefix" placeholder="/ai">
        <label>白名单 senderId <span class="hint">(逗号分隔,留空=允许所有)</span></label><input id="im_allow" placeholder="uid1, uid2">
        <div class="modal__row"><button class="btn" id="imSave">保存</button></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
