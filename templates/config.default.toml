# agent-connect 配置
# 生成位置: ~/.agent-connect/config.toml
# 修改方式: agent-connect config set <key> <value>  或  Web 控制台配置页

# ── Web 控制台（agent-connect serve）──
[web]
host = "127.0.0.1"       # 仅监听本机；控制台开放访问、无需登录
port = 8787

# ── 主动通知（仅在这两种情况下推送，其余不打扰）──
[notify]
enabled = true
scope = "all"                    # all | controllable（仅通知你远控的 tmux 会话）
on_needs_confirm = true          # 会话进入 waiting（需你确认/输入）时推送
on_task_done = true              # 会话 busy → idle（任务完成）时推送
monitor_only = false             # 纯监控型 GUI 应用(qwen/qoderwork)是否也推；默认 false=屏蔽
cooldown_ms = 30000              # 同一会话同类通知的冷却

# ── 时效过滤（Web 看板与 IM list_sessions 共用，避免过多旧任务透出）──
[filter]
window_days = 3                  # 已完成任务只显示近 N 天；0 = 全部。运行中/待输入始终显示

# ── 信使 Agent（Vercel AI SDK）──
[messenger]
provider = "openai-compatible"   # openai-compatible | openai | anthropic
model = "gpt-4o-mini"
api_key = ""
base_url = ""                    # 兼容端点如 https://gw/v1；anthropic 内网网关如 https://gw/compatible/v1
auth_style = ""                  # anthropic 专用：留空=默认 x-api-key；填 "bearer" 走 Authorization: Bearer（如内网 token-hub）
max_steps = 8
conversation_key = "messenger"   # Web 与 IM 共享的信使会话 key

# ── IM 连接器闸门（平台无关：按 CC_SESSION_KEY 的平台名匹配 im.platforms.<name>）──
# cc-connect 支持 钉钉/飞书/Telegram/Slack/Discord/企业微信/QQ 等；
# 每接入一个 IM，就在这里加一段同名闸门（不配则用默认：启用 + 空白名单=允许所有）。
[im.platforms.dingtalk]
enabled = true
command_prefix = "/ai"           # 留空 = 处理所有消息
allowed_sender_ids = []          # 发送者 ID 白名单；留空 = 允许所有（不匹配时机器人会明确回复无权限）
confirm_words = ["确认", "确定", "yes", "y", "ok"]
cancel_words = ["取消", "no", "n"]
confirm_ttl_ms = 300000

# 其它 IM 示例（把 cc-connect 的对应平台配好后，按需加闸门）：
# [im.platforms.telegram]
# enabled = true
# command_prefix = ""
# allowed_sender_ids = []

# ── cc-connect 转发：把信使作为它的 acp agent ──
[[projects]]
name = "messenger"

[projects.agent]
type = "acp"

[projects.agent.options]
work_dir = "~"                   # 信使不依赖 work_dir，占位即可
cmd = "agent-connect"
args = ["acp"]

[[projects.platforms]]
type = "dingtalk"

[projects.platforms.options]
client_id = ""                   # 钉钉 AppKey
client_secret = ""               # 钉钉 AppSecret
# 流式 AI 卡片（可选）：在钉钉开放平台创建「AI 卡片模板」后填其 templateId，
# 回复即以打字机式流式呈现；不填则回退为普通消息（功能不受影响）。
# card_template_id = ""
# card_template_key = "content"
# card_throttle_ms = 300
